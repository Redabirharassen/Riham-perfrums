<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

/* Vitrine : bandeau vert flacon rayé de pluie fine, filtres en puces, grille de flacons ;
   fiche parfum, panier et formulaire vendeur s'ouvrent en feuilles par-dessus. */
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --surface-2:#E0E8E5; --ink:#13211F; --ink-2:#4A5C58; --line:#C9D5D1;
  --bottle:#1F4D45; --on-bottle:#F1F7F5; --amber:#9A5A12; --fresh:#79BDB1; --liq-amber:#C98A3A; --liq-mist:#B9C9C4;
  --hero-bg:#173D37; --hero-fg:#EAF3F0; --hero-accent:#E8B669; --rain:rgba(234,243,240,.13);
  --wa:#17794A; --on-wa:#FFFFFF; --danger:#A5352A; --scrim:rgba(8,14,13,.55);
  --display:"Marcellus","El Messiri",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1615; --surface:#15211F; --surface-2:#1E2D2A; --ink:#E6EEEB; --ink-2:#9DB0AB; --line:#2B3D3A;
    --bottle:#BFE3DA; --on-bottle:#0D1615; --amber:#E3A857; --fresh:#5FA89C; --liq-amber:#C98A3A; --liq-mist:#5C706B;
    --hero-bg:#12302B; --hero-fg:#EAF3F0; --hero-accent:#E8B669; --rain:rgba(234,243,240,.10);
    --wa:#35B777; --on-wa:#06140D; --danger:#EC8377; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1615; --surface:#15211F; --surface-2:#1E2D2A; --ink:#E6EEEB; --ink-2:#9DB0AB; --line:#2B3D3A;
  --bottle:#BFE3DA; --on-bottle:#0D1615; --amber:#E3A857; --fresh:#5FA89C; --liq-amber:#C98A3A; --liq-mist:#5C706B;
  --hero-bg:#12302B; --hero-fg:#EAF3F0; --hero-accent:#E8B669; --rain:rgba(234,243,240,.10);
  --wa:#35B777; --on-wa:#06140D; --danger:#EC8377; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}

/* barre vendeur */
.ownerbar{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.ownerbar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.ownerbar span{color:var(--ink-2)}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;line-height:1.1;min-width:0}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--bottle);border-color:var(--bottle);color:var(--on-bottle)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa);font-weight:600;min-height:48px;width:100%}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bottle);color:var(--on-bottle);
  font-size:12px;line-height:20px;font-variant-numeric:tabular-nums;text-align:center}

/* bandeau */
.hero{background-color:var(--hero-bg);color:var(--hero-fg);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(104deg,transparent 0 17px,var(--rain) 17px 18px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);mask-image:linear-gradient(to bottom,#000 0%,transparent 85%)}
.hero .wrap{position:relative;padding-block:30px 28px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-accent)}
[dir="rtl"] .hero .eyebrow{letter-spacing:0;font-size:14px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.2vw,40px);line-height:1.15;max-width:18em;text-wrap:balance}
[dir="rtl"] .hero h1{font-weight:600;line-height:1.35}
.hero p{max-width:34em;opacity:.86}

/* filtres */
.filters{padding-block:18px 6px;display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-row .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);min-width:58px}
[dir="rtl"] .filter-row .lbl{letter-spacing:0;font-size:13px}
.chip{min-height:36px;padding:4px 14px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--bottle);border-color:var(--bottle);color:var(--on-bottle)}
.field-input,.search{width:100%;min-height:42px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search{max-width:360px}
textarea.field-input{min-height:74px;resize:vertical}

/* grille */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-block:14px 40px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-media{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:0;background:var(--surface-2);overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;display:block}
.bottle{width:100%;height:100%;display:block}
.b-cap{fill:var(--ink)} .b-neck{fill:var(--ink-2)} .b-glass{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.b-label{fill:var(--surface)} .liq-fresh{fill:var(--fresh)} .liq-amber{fill:var(--liq-amber)} .liq-mist{fill:var(--liq-mist)}
.badges{position:absolute;inset-block-start:8px;inset-inline-start:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--ink);color:var(--bg)}
.badge.promo{background:var(--amber);color:var(--surface);direction:ltr}
.badge.ex{background:var(--surface);color:var(--ink-2);border:1px dashed var(--ink-2)}
.card.out .card-media img,.card.out .bottle{opacity:.45}
.card-body{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;flex:1}
.card-body h3{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
[dir="rtl"] .card-body h3{font-weight:600}
.meta{font-size:12.5px;color:var(--ink-2)}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.card-foot>span{display:flex;flex-direction:column;line-height:1.3}
.price{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.old{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding-block:40px;color:var(--ink-2);text-align:center}

/* pied */
.foot{border-top:1px solid var(--line);color:var(--ink-2);font-size:13px}
.foot .wrap{padding-block:20px 28px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.foot a{color:var(--ink);text-underline-offset:3px}
.foot .links{display:flex;flex-wrap:wrap;gap:14px}
.tel{font-variant-numeric:tabular-nums;user-select:all;direction:ltr;unicode-bidi:isolate;color:var(--ink);font-weight:500}

/* feuilles */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:min(540px,calc(100% - 32px));max-height:calc(100% - 32px);border-radius:14px;overflow:auto}
dialog::backdrop{background:var(--scrim)}
@media (max-width:560px){dialog{max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92%}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:20px}
[dir="rtl"] .sheet-head h2{font-weight:600}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet-media{aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.sheet-media img{width:100%;height:100%;object-fit:contain;display:block}
.desc{color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row .grow{flex:1;min-width:150px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:transparent;font-size:18px;line-height:1}
.stepper button:hover{background:var(--surface-2)}
.stepper output{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line .nm{font-weight:500;overflow-wrap:anywhere;min-width:0}
.line .stepper{justify-self:start}
.line .linkbtn{justify-self:end}
.line .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.total{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;padding-block:12px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:520px){.fields.two{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--ink-2)}
.help{font-size:12.5px;color:var(--ink-2)}
.err{color:var(--danger);font-size:13.5px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:18px;height:18px}

/* espace vendeur */
.seller{padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px}
[dir="rtl"] .panel h2{font-weight:600}
.note{font-size:13.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:52px 1fr;gap:6px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.thumb{width:52px;height:64px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{min-width:0} .pinfo b{font-weight:600;overflow-wrap:anywhere}
.pact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (min-width:600px){.plist li{grid-template-columns:52px 1fr auto}.pact{grid-column:auto}}
.photo-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.photo-prev{width:72px;height:90px;border-radius:6px;overflow:hidden;background:var(--surface-2);flex-shrink:0}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}

.pubbar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.pubbar .in{max-width:1048px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pubbar .btn{border-color:transparent}
.pubbar .ghost{background:transparent;color:var(--bg);border-color:var(--ink-2)}
.pubbar .go{background:var(--bg);color:var(--ink);font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;max-width:100%}
@media (prefers-reduced-motion:no-preference){
  .toast span{animation:rise .2s ease-out}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>

function readData(){

}
function t(k){ return (T[S.lang] && T[S.lang][k]) || T.fr[k] || k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ return (Math.round(Number(n||0)*100)/100)+' '+t('cur'); }
function $(id){ return document.getElementById(id); }
function priceText(p){ return p.price>0 ? money(p.price) : t('onRequest'); }
function promo(p){ return p.price>0 && p.oldPrice>p.price; }
function lineText(i){ return i.p.price>0 ? money(i.p.price*i.qty) : t('onRequest'); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

function product(id){ for(var i=0;i<DATA.products.length;i++){ if(DATA.products[i].id===id) return DATA.products[i]; } return null; }
function genderLabel(g){ return g==='h'?t('men'):g==='f'?t('women'):t('unisex'); }
function seasonLabel(s){ return s==='e'?t('summer'):s==='w'?t('winter'):t('anySeason'); }
function metaLine(p){ var a=[]; if(p.ml) a.push(p.ml+' '+t('ml')); a.push(genderLabel(p.gender)); a.push(seasonLabel(p.season)); return a.join(' · '); }
function desc(p){ return S.lang==='ar' ? (p.descAr||p.descFr||'') : (p.descFr||p.descAr||''); }

function waNumber(){

}
function link(u){ u=String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }

function visible(){
  var q=S.q.trim().toLowerCase();

function saveCart(){ lsSet('rp-cart', JSON.stringify(S.cart)); renderCartBtn(); }

function cartItems(){ var a=[]; for(var k in S.cart){ var p=product(k); if(p && S.cart[k]>0) a.push({p:p,qty:S.cart[k]}); } return a; }
function cartTotal(){ return cartItems().reduce(function(s,i){ return s+i.p.price*i.qty; },0); }
function totalText(){
  var items=cartItems(), open=items.some(function(i){ return !(i.p.price>0); }), sum=cartTotal();
  if(!open) return money(sum);
  return sum>0 ? money(sum)+' + '+t('onRequest') : t('onRequest');
}

  var L=[t('msgHello').replace('{shop}',DATA.shop.name)];
  cartItems().forEach(function(i){ L.push('• '+i.qty+' × '+i.p.name+(i.p.ml?' ('+i.p.ml+' '+t('ml')+')':'')+' — '+lineText(i)); });
  L.push(t('total')+' : '+totalText()); L.push('');
  if(S.form.name) L.push(t('yourName')+' : '+S.form.name);
  if(S.form.city) L.push(t('city')+' : '+S.form.city);
  if(S.form.address) L.push(t('address').replace(/\s*\(.*\)/,'')+' : '+S.form.address);

      '<label class="check full"><input type="checkbox" id="ef-stock"'+(p.stock?' checked':'')+'> <span>'+esc(t('inStock'))+'</span></label>'+
    '</div><p class="err" id="edit-err" hidden></p>'+
    '<div class="row"><button type="submit" class="btn primary grow">'+esc(t('save'))+'</button><button type="button" class="btn" data-act="close">'+esc(t('cancel'))+'</button></div></form>';
  renderPhotoPrev();
  var d=$('dlg-edit'); if(!d.open) d.showModal();
}
function renderPhotoPrev(){
  var el=$('ef-prev'); if(!el) return;
  var g=$('ef-season'), fake={img:S.edit.img,name:'',season:g?g.value:'a'};
  el.innerHTML=media(fake);
  $('ef-rm').hidden=!S.edit.img;
}
function readPhoto(file){
  return new Promise(function(res,rej){
    if(!file || !/^image\//.test(file.type)){ rej(new Error('type')); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=760, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ res(c.toDataURL('image/jpeg',0.8)); }catch(e){ rej(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src=url;
  });
}
function saveProduct(){
  var name=$('ef-name').value.trim(), price=parseFloat($('ef-price').value)||0, err=$('edit-err');
  if(!name || price<0){ err.textContent=t('needNamePrice'); err.hidden=false; return; }
  var rec={ id:S.edit.id||('p'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)),
    name:name, price:price, oldPrice:parseFloat($('ef-old').value)||0, ml:parseInt($('ef-ml').value,10)||0,
    gender:$('ef-gender').value, season:$('ef-season').value, descFr:$('ef-dfr').value.trim(), descAr:$('ef-dar').value.trim(),
    img:S.edit.img||'', stock:$('ef-stock').checked };
  var i=-1; DATA.products.forEach(function(p,k){ if(p.id===rec.id) i=k; });
  if(i>=0) DATA.products[i]=rec; else DATA.products.unshift(rec);
  $('dlg-edit').close(); S.edit=null; markDirty(); renderMain();
}

/* ---------- publication ---------- */
function renderPubbar(){
  var el=$('pubbar'); if(!el) return;
  el.hidden = !(S.canEdit && S.dirty);
  if(el.hidden) return;
  el.innerHTML='<div class="in"><span>'+esc(t('unpublished'))+'</span><span class="row">'+
    '<button class="btn small ghost" data-act="discard"'+(S.publishing?' disabled':'')+'>'+esc(t('discard'))+'</button>'+
    '<button class="btn small go" data-act="publish"'+(S.publishing?' disabled':'')+'>'+esc(S.publishing?t('publishing'):t('publish'))+'</button></span></div>';
}
function buildDocument(){
  var json=JSON.stringify(DATA).split('<').join('\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  var end='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+
    ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}'+
    '</style></head><body>\n'+
    '<title>Riham Perfums</title>\n'+(FONT_LINK?'<link rel="stylesheet" href="'+FONT_LINK.getAttribute('href')+'">':'')+'\n'+
    '<style id="rp-style">'+$('rp-style').textContent+'</style>\n<div id="app"></div>\n'+
    '<script type="application/json" id="rp-data">'+json+end+'\n'+
    '<script id="rp-code">'+$('rp-code').textContent+end+'\n\n</body></html>';
}
function publish(){
  if(!S.artifact || S.publishing) return;
  var html=buildDocument();
  if(html.length>15500000){ toast(t('pubTooLarge')); return; }
  S.publishing=true; renderPubbar();
  ssSet('rp-view','seller');
  S.artifact.publish(html).then(function(){
    S.publishing=false; S.dirty=false; renderPubbar();
  }).catch(function(e){
    var c=e&&e.code; S.publishing=false; renderPubbar();
    if(c==='conflict') toast(t('pubConflict'));
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){
      toast(t('pubReadOnly')); S.canEdit=false; S.view='shop'; renderOwnerbar(); renderMain(); renderPubbar();
    }
    else if(c==='too_large') toast(t('pubTooLarge'));
    else if(c==='rate_limited') toast(t('pubSlow'));
    else toast(t('pubFail'));
  });
}
function exportCatalogue(){
  if(!S.downloads) return;
  S.downloads.save({filename:'catalogue.json',data:JSON.stringify(DATA)}).then(function(){ toast(t('exported')); })
    .catch(function(e){ var c=e&&e.code; if(c==='declined') return; toast(c==='rate_limited'?t('pubSlow'):t('exportFail')); });
}
function discard(){ DATA=readData(); S.dirty=false; S.pendingDelete=null; renderMain(); renderFoot(); renderCartBtn(); renderPubbar(); }

/* ---------- divers ---------- */
var toastTimer=null;
function toast(msg){
  var el=$('toast'); if(!el) return;
  el.innerHTML='<span>'+esc(msg)+'</span>';
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.innerHTML=''; },3200);
}
function copyMessage(){
  var msg=orderMessage();
  try{
    navigator.clipboard.writeText(msg).then(function(){ toast(t('copied')); }).catch(function(){ showMessageText(msg); });
  }catch(e){ showMessageText(msg); }
}
function showMessageText(msg){
  var b=$('rp-copy'); if(!b) return;
  var old=$('rp-msgtext'); if(old) old.remove();
  var ta=document.createElement('textarea'); ta.id='rp-msgtext'; ta.className='field-input'; ta.readOnly=true; ta.rows=7; ta.value=msg;
  b.insertAdjacentElement('afterend',ta); ta.focus(); ta.select(); toast(t('copyFail'));
}
function setLang(l){ S.lang=l; lsSet('rp-lang',l); var dc=$('dlg-cart'), dp=$('dlg-product'); var co=dc&&dc.open, po=dp&&dp.open; renderShell(); if(po&&S.detail) openDetail(S.detail); if(co) openCart(); }

document.addEventListener('click',function(e){
  var dlg=e.target.closest ? e.target : null;
  if(dlg && dlg.tagName==='DIALOG'){ dlg.close(); return; }
  var b=e.target.closest && e.target.closest('[data-act]');
  if(!b){
    var wa=e.target.closest && e.target.closest('#rp-wa');
    if(wa){
      var err=$('cart-err');
      if(!S.form.name.trim() || !S.form.city.trim()){ e.preventDefault(); err.textContent=t('required'); err.hidden=false; $(S.form.name.trim()?'cf-city':'cf-name').focus(); }
      else { err.hidden=true; updateWa(); }
    }
    return;
  }
  var a=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  if(a==='lang') setLang(S.lang==='fr'?'ar':'fr');
  else if(a==='cart-open') openCart();
  else if(a==='view-seller'){ S.view='seller'; ssSet('rp-view','seller'); renderOwnerbar(); renderMain(); window.scrollTo(0,0); }
  else if(a==='view-shop'){ S.view='shop'; ssSet('rp-view','shop'); renderOwnerbar(); renderMain(); window.scrollTo(0,0); }
  else if(a==='filt'){
    if(b.getAttribute('data-k')==='g') S.fg=b.getAttribute('data-v'); else S.fs=b.getAttribute('data-v');
    var row=b.parentNode.querySelectorAll('.chip'); for(var i=0;i<row.length;i++) row[i].setAttribute('aria-pressed', row[i]===b ? 'true':'false');
    renderGrid();
  }
  else if(a==='open') openDetail(id);
  else if(a==='add') addToCart(id,1);
  else if(a==='dq'){ S.detailQty=Math.max(1,Math.min(99,S.detailQty+parseInt(b.getAttribute('data-d'),10))); $('dp-qty').textContent=S.detailQty; }
  else if(a==='detail-add'){ addToCart(S.detail,S.detailQty); $('dlg-product').close(); }
  else if(a==='cq'){ var q=(S.cart[id]||0)+parseInt(b.getAttribute('data-d'),10); if(q<=0) delete S.cart[id]; else S.cart[id]=Math.min(99,q); saveCart(); renderLines(); }
  else if(a==='rm'){ delete S.cart[id]; saveCart(); renderLines(); }
  else if(a==='close'){ var d=b.closest('dialog'); if(d) d.close(); }
  else if(a==='copy') copyMessage();
  else if(a==='new') openEdit(null);
  else if(a==='edit') openEdit(id);
  else if(a==='del'){ S.pendingDelete=id; renderPlist(); }
  else if(a==='del-no'){ S.pendingDelete=null; renderPlist(); }
  else if(a==='del-yes'){ DATA.products=DATA.products.filter(function(p){return p.id!==id;}); S.pendingDelete=null; delete S.cart[id]; saveCart(); markDirty(); renderMain(); }
  else if(a==='photo-rm'){ S.edit.img=''; renderPhotoPrev(); }
  else if(a==='publish') publish();
  else if(a==='export') exportCatalogue();
  else if(a==='discard') discard();
});
document.addEventListener('input',function(e){
  var el=e.target, id=el.id;
  if(id==='rp-q'){ S.q=el.value; renderGrid(); }
  else if(id==='cf-name'||id==='cf-city'||id==='cf-address'){
    S.form[id.slice(3)]=el.value; lsSet('rp-form',JSON.stringify(S.form)); updateWa();
    if(S.form.name.trim()&&S.form.city.trim()){ var er=$('cart-err'); if(er) er.hidden=true; }
  }
  else if(el.getAttribute && el.getAttribute('data-set')){ DATA.shop[el.getAttribute('data-set')]=el.value.trim(); markDirty(); renderFoot(); }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='ef-file' && el.files && el.files[0]){
    readPhoto(el.files[0]).then(function(url){ if(S.edit){ S.edit.img=url; renderPhotoPrev(); } })
      .catch(function(){ var er=$('edit-err'); if(er){ er.textContent=t('photoFail'); er.hidden=false; } });
    el.value='';
  }
  else if(el.id==='ef-season') renderPhotoPrev();
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='edit-form') saveProduct();
});

function lightUp(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('downloads')]).then(function(r){
    var user=r[0], art=r[1];
    if(!art) return;
    S.artifact=art; S.downloads=r[2]||null;
    return (user ? user.canEdit() : Promise.resolve(true)).then(function(ok){
      if(!ok) return;
      S.canEdit=true;
      if(ssGet('rp-view')==='seller') S.view='seller';
      renderOwnerbar(); renderPubbar();
      if(S.view==='seller') renderMain();
      var dc=$('dlg-cart'); if(dc && dc.open) renderCart();
    });
  }).catch(function(){});
}

/* Site public et application Android : le catalogue vient d'un fichier en ligne.
   Dans l'artifact, RP_CATALOGUE_URL n'existe pas et rien n'est chargé. */
function validData(d){ return !!d && typeof d==='object' && !!d.shop && Array.isArray(d.products); }
function applyRemote(d){
  if(S.canEdit || S.dirty) return;
  DATA=d;
  var dc=$('dlg-cart'), dp=$('dlg-product'), co=dc&&dc.open, po=dp&&dp.open;
  renderShell(); if(po&&S.detail) openDetail(S.detail); if(co) openCart();
}
function loadRemote(){
  var u=window.RP_CATALOGUE_URL; if(!u || typeof fetch!=='function') return;
  try{ var c=JSON.parse(lsGet('rp-remote')||'null'); if(validData(c)) applyRemote(c); }catch(e){}
  fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(d){
      if(!validData(d)) return;
      var s=JSON.stringify(d), same=(s===JSON.stringify(DATA));
      lsSet('rp-remote',s);
      if(!same) applyRemote(d);
    }).catch(function(){});
}

function start(saved){
  saved=saved||{};
  var l=saved.lang||lsGet('rp-lang'); if(l==='ar'||l==='fr') S.lang=l;
  try{ var c=saved.cart||JSON.parse(lsGet('rp-cart')||'{}'); if(c&&typeof c==='object') S.cart=c; }catch(e){}
  try{ var f=JSON.parse(lsGet('rp-form')||'{}'); if(f&&typeof f==='object'){ S.form.name=f.name||''; S.form.city=f.city||''; S.form.address=f.address||''; } }catch(e){}
  if(saved.draft && saved.draft.products){ DATA=saved.draft; S.dirty=true; }
  renderShell();
  lightUp();
  loadRemote();
}
var hot=window.claude && window.claude.hot;
if(hot && typeof hot.snapshot==='function'){
  try{ hot.snapshot(function(){ return {lang:S.lang,cart:S.cart,draft:S.dirty?DATA:null}; }); }catch(e){}
}
if(hot && typeof hot.ready==='function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
